<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ERP 編碼系統 - 完整修復版</title>
  <style>
    :root { --primary: #1a73e8; --bg: #f8f9fa; --danger: #d93025; --edit: #f4b400; }
    body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { background: #fff; width: 100%; max-width: 550px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 30px; }
    label { display: block; margin-top: 20px; font-weight: bold; font-size: 18px; color: #333; }
    input, select { width: 100%; padding: 15px; margin-top: 8px; border: 2px solid #eee; border-radius: 10px; box-sizing: border-box; font-size: 20px; outline: none; }
    
    /* 分頁樣式 */
    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 25px; }
    .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: #888; font-size: 18px; transition: all 0.2s; }
    .tab.active { color: var(--primary); border-bottom: 4px solid var(--primary); font-weight: bold; }
    
    /* 重要：隱藏控制 */
    .hidden { display: none !important; }
    
    .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 18px; border-radius: 10px; margin-top: 30px; cursor: pointer; font-size: 20px; font-weight: bold; }
    .btn-del { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-bottom: 5px; width: 60px; display: block; margin-left: auto; margin-right: auto; }
    .btn-edit { background: var(--edit); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-bottom: 5px; width: 60px; display: block; margin-left: auto; margin-right: auto; }
    
    /* 表格與欄位對齊 */
    .history-container { width: 100%; max-width: 1000px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 850px; table-layout: fixed; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #eee; text-align: left; word-wrap: break-word; }
    th { background: #f8f9fa; color: #5f6368; font-size: 14px; }

    /* 寬度百分比設定 */
    .col-date { width: 12%; }
    .col-code { width: 18%; font-weight: bold; }
    .col-id   { width: 10%; }
    .col-amt  { width: 13%; text-align: right; }
    .col-name { width: 37%; }
    .col-ctrl { width: 10%; text-align: center; }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #f3f3f3; border-top: 2px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 金額列（含稅/未稅切換） */
    .amt-row { display: flex; gap: 10px; align-items: stretch; }
    .amt-row select { width: 110px; flex-shrink: 0; }
    .amt-row input { flex: 1; }
    .amt-note { margin-top: 8px; font-size: 15px; color: #1a73e8; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-p" onclick="switchTab('project')">客戶工程案號</div>
      <div class="tab" id="tab-v" onclick="switchTab('vendor')">廠商品號系統</div>
    </div>        
    
    <div id="project-form">
      <label>搜尋客戶</label>
      <input list="custList" id="p_search" placeholder="打字搜尋...">
      <datalist id="custList"></datalist>

      <label>金額</label>
      <div class="amt-row">
        <select id="p_tax_type" onchange="onTaxTypeChange()">
          <option value="untaxed" selected>未稅</option>
          <option value="taxed">含稅</option>
        </select>
        <input type="text" id="p_amt_show" placeholder="請輸入未稅金額">
      </div>
      <div class="amt-note" id="p_amt_note"></div>
      <input type="hidden" id="p_amt">

      <label>名稱/備註</label>
      <input type="text" id="p_item" placeholder="名稱">
      <label>強制 D 案?</label>
      <select id="p_d"><option value="否">否</option><option value="是">是</option></select>
      <button class="btn" id="btnP" onclick="saveP()">產生案號並存檔</button>
    </div>

    <div id="vendor-form" class="hidden">
      <label>搜尋廠商</label>
      <input list="vendList" id="v_search" placeholder="打字搜尋...">
      <datalist id="vendList"></datalist>
      <label>性質</label>
      <select id="v_prop" onchange="checkCity()">
        <option>承攬(連工帶料)</option><option>工資</option><option>7C1(吊車)</option><option>7C2(運輸)</option>
      </select>
      <div id="v_city_box" class="hidden">
        <label>區域/縣市</label>
        <select id="v_city">
          <option value="">請選擇</option>
          <optgroup label="北 (02)"><option>台北</option><option>桃園</option><option>新竹</option></optgroup>
          <optgroup label="中 (04)"><option>台中</option><option>彰化</option></optgroup>
          <optgroup label="南 (07)"><option>嘉義</option><option>台南</option><option>高雄</option></optgroup>
        </select>
      </div>
      <label>品項/備註</label>
      <input type="text" id="v_item" placeholder="品項名稱">
      <button class="btn" id="btnV" onclick="saveV()">產生品號並存檔</button>
    </div>
  </div>

  <div class="history-container">
    <h3 id="hTitle">最近明細紀錄 - 客戶專案</h3>
    <table>
      <thead><tr id="hHead"></tr></thead>
      <tbody id="hBody"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbylFcjL1lhcDPRLgCS8ChlsDHOQ273SyIsNDGe65mThL0vjafFfTe3McX4dvbiLjDc3/exec"; 
    let currentTab = 'project';
    const cache = { project: null, vendor: null, lastUpdate: { project: 0, vendor: 0 } };

    const amtInp = document.getElementById('p_amt_show');
    const amtHid = document.getElementById('p_amt'); // 永遠儲存「未稅」金額，供送出用
    const taxTypeSel = document.getElementById('p_tax_type');
    const amtNote = document.getElementById('p_amt_note');
    const TAX_RATE = 1.05; // 稅率 5%

    let rawAmt = ''; // 使用者實際輸入的數字（依目前選擇的稅別解讀）

    // 依目前輸入與稅別，重新計算未稅金額並更新提示與隱藏欄位
    function recalcAmt() {
      if (!rawAmt) { amtHid.value = ''; amtNote.textContent = ''; return; }
      const entered = Number(rawAmt);
      let untaxed;
      if (taxTypeSel.value === 'taxed') {
        untaxed = Math.round(entered / TAX_RATE);
        amtNote.textContent = `未稅金額：$${untaxed.toLocaleString('zh-TW')}（換算自含稅 $${entered.toLocaleString('zh-TW')}）`;
      } else {
        untaxed = entered;
        amtNote.textContent = `未稅金額：$${untaxed.toLocaleString('zh-TW')}`;
      }
      amtHid.value = untaxed;
    }

    // 切換未稅/含稅時：更新提示文字、placeholder，並重新計算
    function onTaxTypeChange() {
      amtInp.placeholder = taxTypeSel.value === 'taxed' ? '請輸入含稅金額' : '請輸入未稅金額';
      recalcAmt();
      if (document.activeElement !== amtInp && rawAmt) {
        amtInp.value = Number(rawAmt).toLocaleString('zh-TW');
      }
    }

    // 金額輸入格式化
    amtInp.addEventListener('input', function() {
      rawAmt = this.value.replace(/\D/g, '');
      this.value = rawAmt;
      recalcAmt();
    });
    amtInp.addEventListener('blur', function() { if (rawAmt) this.value = Number(rawAmt).toLocaleString('zh-TW'); });
    amtInp.addEventListener('focus', function() { this.value = rawAmt; });

    function checkCity() {
      const p = document.getElementById('v_prop').value;
      document.getElementById('v_city_box').classList.toggle('hidden', !p.includes('7C'));
    }

    function fmtDate(dStr) {
      if (!dStr) return "";
      const d = new Date(dStr);
      return isNaN(d.getTime()) ? dStr : `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    // API 通訊
    async function api(action, data) {
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, data }) });
        const json = await res.json();
        return json.data;
      } catch (e) { console.error('API Error:', e); return null; }
    }

    // 關鍵修復：補齊編輯與刪除函數 (放置於全域範圍)
    async function editRow(code, oldName, oldAmt) {
      let newName = prompt(`修改 [${code}] 的名稱/品項：`, oldName);
      if (newName === null) return;

      let newAmt = oldAmt;
      if (currentTab === 'project') {
        let amtInput = prompt(`修改 [${code}] 的未稅金額 (僅限數字)：`, oldAmt);
        if (amtInput === null) return;
        newAmt = amtInput.replace(/\D/g, '');
      }

      const res = await api("updateRow", { type: currentTab, code, newName, newAmt });
      alert(res || "更新成功");
      await loadHistory(currentTab, true);
    }

    async function delRow(code) {
      if (!confirm(`確定要刪除編號 ${code} 嗎？`)) return;
      const res = await api("deleteRow", { type: currentTab, code });
      alert(res || "刪除成功");
      await loadHistory(currentTab, true);
    }

    // 渲染表格
    function render(rows, type) {
      currentTab = type;
      const head = document.getElementById('hHead'), body = document.getElementById('hBody');
      
      head.innerHTML = type === 'project' 
        ? `<th class="col-date">日期</th><th class="col-code">案號</th><th class="col-id">客戶</th><th class="col-amt">未稅金額</th><th class="col-name">名稱</th><th class="col-ctrl">管理</th>`
        : `<th class="col-date">日期</th><th class="col-code">品號</th><th class="col-id">廠商</th><th class="col-amt">性質</th><th class="col-name">品項</th><th class="col-ctrl">管理</th>`;
      
      if (!rows || rows.length === 0) {
        body.innerHTML = "<tr><td colspan='6' style='text-align:center;'>尚未有紀錄</td></tr>";
        return;
      }

      const fragment = document.createDocumentFragment();
      rows.forEach(r => {
        const tr = document.createElement('tr');
        const displayVal = type === 'project' ? Number(r[3]).toLocaleString() : r[3];
        const itemName = r[5] || '';
        const code = r[1];
        
        tr.innerHTML = `
          <td class="col-date">${fmtDate(r[0])}</td>
          <td class="col-code">${code}</td>
          <td class="col-id">${r[2]}</td>
          <td class="col-amt">${displayVal}</td>
          <td class="col-name">${itemName}</td>
          <td class="col-ctrl">
            <button class="btn-edit" onclick="editRow('${code}', '${itemName.replace(/'/g, "\\'")}', '${r[3]}')">編輯</button>
            <button class="btn-del" onclick="delRow('${code}')">刪除</button>
          </td>
        `;
        fragment.appendChild(tr);
      });
      body.innerHTML = '';
      body.appendChild(fragment);
    }

    async function loadHistory(type, forceRefresh = false) {
      if (!forceRefresh && cache[type]) { render(cache[type], type); return; }
      const data = await api("getHistory", {type});
      if(data) { cache[type] = data; render(data, type); }
    }

    async function switchTab(t) {
      const isP = t === 'project';
      document.getElementById('project-form').classList.toggle('hidden', !isP);
      document.getElementById('vendor-form').classList.toggle('hidden', isP);
      document.getElementById('tab-p').classList.toggle('active', isP);
      document.getElementById('tab-v').classList.toggle('active', !isP);
      document.getElementById('hTitle').innerText = isP ? "最近明細紀錄 - 客戶專案" : "最近明細紀錄 - 廠商品號";
      await loadHistory(t);
    }

    window.onload = async () => {
      const d = await api("getInitialData", {});
      if(d) {
        const clist = document.getElementById('custList'), vlist = document.getElementById('vendList');
        d.customers.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; clist.appendChild(o); });
        d.vendors.forEach(v => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.name; vlist.appendChild(o); });
        render(d.projectHistory, 'project');
      }
    };

    async function saveP() {
      const btn = document.getElementById('btnP'); btn.disabled = true;
      btn.innerHTML = '處理中<span class="spinner"></span>';
      const id = await api("submitProject", { customerID: document.getElementById('p_search').value, amount: amtHid.value, itemName: document.getElementById('p_item').value, isCaseD: document.getElementById('p_d').value });
      if(id) {
        alert("案號產生成功：" + id + "（未稅金額：$" + Number(amtHid.value).toLocaleString('zh-TW') + "）");
        await loadHistory('project', true);
      }
      btn.disabled = false; btn.innerHTML = '產生案號並存檔';
    }

    async function saveV() {
      const btn = document.getElementById('btnV'); btn.disabled = true;
      btn.innerHTML = '處理中<span class="spinner"></span>';
      const id = await api("submitVendor", { vendorID: document.getElementById('v_search').value, property: document.getElementById('v_prop').value, city: document.getElementById('v_city').value, itemName: document.getElementById('v_item').value });
      if(id) { alert("品號產生成功：" + id); await loadHistory('vendor', true); }
      btn.disabled = false; btn.innerHTML = '產生品號並存檔';
    }
  </script>
</body>
</html>
